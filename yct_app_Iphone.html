// ════════════════════════════════════════════════
// WRITE VIEW — HanziWriter
// ════════════════════════════════════════════════
var _writeWord=null,_writeChars=[],_writeCharIdx=0;
var _hanziWriter=null,_writeStrokeCount=0,_writeDoneStrokes=0,_writePhase='idle';
// _writePhase: 'idle' | 'animating' | 'quiz'

function _isDark(){
  return document.body.classList.contains('dark')||
    (!document.body.classList.contains('light')&&window.matchMedia('(prefers-color-scheme:dark)').matches);
}

function openWrite(word){
  _writeWord=word;
  _writeChars=Array.from(word.h); // proper Unicode split
  _writeCharIdx=0;
  document.getElementById('write-word-hanzi').textContent=word.h;
  document.getElementById('write-word-sub').textContent=word.p+' — '+word.fr;
  var tb=document.getElementById('write-topbar');
  tb.className='write-topbar '+(current?data[current].lc:'');
  document.getElementById('write-view').classList.add('wv-open');
  // Multi-char navigation
  var nav=document.getElementById('write-char-nav');
  if(_writeChars.length>1){
    nav.style.display='flex';
    updateCharNav();
  } else {
    nav.style.display='none';
  }
  requestAnimationFrame(function(){requestAnimationFrame(initHanziWriter);});
}
function closeWrite(){
  if(_hanziWriter){_hanziWriter=null;}
  document.getElementById('hanzi-writer-target').innerHTML='';
  document.getElementById('write-view').classList.remove('wv-open');
  _writePhase='idle';
}

function updateCharNav(){
  var n=_writeChars.length;
  document.getElementById('write-char-label').textContent=
    _writeChars[_writeCharIdx]+' ('+((_writeCharIdx+1))+'/'+n+')';
  document.getElementById('write-prev').disabled=_writeCharIdx===0;
  document.getElementById('write-next').disabled=_writeCharIdx===n-1;
}

function _lcColor(){
  if(!current)return'#0F6E56';
  var map={l1:'#0F6E56',l2:'#185FA5',l3:'#534AB7',l4:'#C45E00',l5:'#A32D2D'};
  var dark={l1:'#2CC48A',l2:'#4D9EE8',l3:'#8E88F0',l4:'#F59A3C',l5:'#E06060'};
  return _isDark()?(dark[data[current].lc]||'#2CC48A'):(map[data[current].lc]||'#0F6E56');
}

function initHanziWriter(){
  if(_hanziWriter){_hanziWriter=null;}
  var target=document.getElementById('hanzi-writer-target');
  target.innerHTML='';
  var wrap=document.getElementById('write-hw-wrap');
  // Size: square fitting the available space
  var bodyH=document.getElementById('write-body').offsetHeight;
  var bodyW=document.getElementById('write-body').offsetWidth;
  // Reserve space for nav + dots + status + actions (~180px)
  var maxSz=Math.min(bodyW-32, bodyH-180, 380);
  var sz=Math.max(maxSz,180);
  wrap.style.width=sz+'px';
  wrap.style.height=sz+'px';

  var dark=_isDark();
  var lc=_lcColor();
  var char=_writeChars[_writeCharIdx];

  setWriteStatus('Chargement…','');
  document.getElementById('write-stroke-dots').innerHTML='';
  _writePhase='idle';

  try{
    _hanziWriter=HanziWriter.create('hanzi-writer-target',char,{
      width:sz,height:sz,
      padding:sz*0.06,
      showOutline:true,
      outlineColor:dark?'rgba(255,255,255,0.18)':'rgba(0,0,0,0.14)',
      showCharacter:false,
      strokeColor:dark?'rgba(200,192,170,0.9)':'rgba(26,24,20,0.85)',
      strokeAnimationSpeed:1.2,
      delayBetweenStrokes:120,
      drawingColor:dark?'rgba(200,192,170,0.95)':'rgba(26,24,20,0.92)',
      drawingWidth:Math.max(5,sz/55),
      highlightColor:lc,
      highlightOnComplete:true,
      leniency:1.25,
      showHintAfterMisses:3,
      gridColor:dark?'rgba(255,255,255,0.10)':'rgba(0,0,0,0.09)',
      renderer:'svg',
      onLoadCharDataSuccess:function(charData){
        _writeStrokeCount=charData.strokes.length;
        buildStrokeDots(_writeStrokeCount);
        animateWrite();
      },
      onLoadCharDataError:function(){
        setWriteStatus('Caractère non disponible','err');
      }
    });
  }catch(e){
    setWriteStatus('Erreur HanziWriter','err');
  }
}

function buildStrokeDots(n){
  var el=document.getElementById('write-stroke-dots');
  var html='';
  for(var i=0;i<n;i++) html+='<div class="wsd" id="wsd-'+i+'"></div>';
  el.innerHTML=html;
  if(n>0) document.getElementById('wsd-0').classList.add('active');
}
function setDot(i,cls){
  var d=document.getElementById('wsd-'+i);
  if(d){d.className='wsd '+cls;}
}
function setWriteStatus(msg,cls){
  var el=document.getElementById('write-status');
  el.textContent=msg;
  el.className='write-status'+(cls?' '+cls:'');
}

function animateWrite(){
  _writePhase='animating';
  setWriteStatus('Regardez l\'ordre des traits…','');
  if(!_hanziWriter)return;
  _hanziWriter.animateCharacter({
    onComplete:function(){
      setTimeout(startWriteQuiz,600);
    }
  });
}

function startWriteQuiz(){
  if(!_hanziWriter)return;
  _writePhase='quiz';
  _writeDoneStrokes=0;
  buildStrokeDots(_writeStrokeCount);
  setWriteStatus('À vous ! Tracez trait par trait ✍️','');
  _hanziWriter.quiz({
    onMistake:function(strokeData){
      var wrap=document.getElementById('write-hw-wrap');
      wrap.classList.remove('shake');
      void wrap.offsetWidth; // reflow
      wrap.classList.add('shake');
      setTimeout(function(){wrap.classList.remove('shake');},260);
      var rem=strokeData.strokesRemaining;
      setWriteStatus('↩ Essayez encore ce trait ('+rem+' restant'+(rem>1?'s':'')+')', 'err');
      setDot(_writeDoneStrokes,'err');
      setTimeout(function(){
        if(_writePhase==='quiz')setDot(_writeDoneStrokes,'active');
        setWriteStatus('Continuez ! ('+(rem)+' trait'+(rem>1?'s':'')+')', '');
      },800);
    },
    onCorrectStroke:function(strokeData){
      setDot(_writeDoneStrokes,'done');
      _writeDoneStrokes++;
      var rem=strokeData.strokesRemaining;
      if(rem>0){
        setDot(_writeDoneStrokes,'active');
        setWriteStatus('✓ Trait suivant… ('+rem+' restant'+(rem>1?'s':'')+')', 'ok');
      }
    },
    onComplete:function(summaryData){
      _writePhase='done';
      var err=summaryData.totalMistakes;
      var msg=err===0?'🏆 Parfait ! Aucune erreur !':err<=2?'🌟 Très bien ! '+err+' erreur'+(err>1?'s':'')+'!':'👍 Tracé complet ! '+err+' erreur'+(err>1?'s':'');
      setWriteStatus(msg,'ok');
      // Auto-advance for multi-char words
      if(_writeChars.length>1&&_writeCharIdx<_writeChars.length-1){
        setTimeout(function(){
          _writeCharIdx++;
          updateCharNav();
          initHanziWriter();
        },1800);
      }
    }
  });
}

// Controls
document.getElementById('write-back').addEventListener('click',closeWrite);
document.getElementById('write-replay').addEventListener('click',function(){
  if(!_hanziWriter)return;
  if(_writePhase==='quiz'||_writePhase==='done'){
    _writePhase='animating';
    buildStrokeDots(_writeStrokeCount);
    setWriteStatus('Regardez l\'ordre des traits…','');
    _hanziWriter.animateCharacter({onComplete:function(){setTimeout(startWriteQuiz,600);}});
  } else if(_writePhase==='animating'){
    _hanziWriter.cancelAnimation();
    setTimeout(startWriteQuiz,200);
  }
});
document.getElementById('write-hint-btn').addEventListener('click',function(){
  if(!_hanziWriter||_writePhase!=='quiz')return;
  _hanziWriter.showCharacter();
  setWriteStatus('Mémorisez bien… 👀','');
  setTimeout(function(){
    _hanziWriter.hideCharacter();
    if(_writePhase==='quiz')setWriteStatus('À vous ! Retracez trait par trait ✍️','');
  },2000);
});
document.getElementById('write-retry-btn').addEventListener('click',function(){
  if(_hanziWriter)initHanziWriter();
});
document.getElementById('write-prev').addEventListener('click',function(){
  if(_writeCharIdx>0){_writeCharIdx--;updateCharNav();initHanziWriter();}
});
document.getElementById('write-next').addEventListener('click',function(){
  if(_writeCharIdx<_writeChars.length-1){_writeCharIdx++;updateCharNav();initHanziWriter();}
});

window.addEventListener('resize',function(){
  if(document.getElementById('write-view').classList.contains('wv-open'))
    requestAnimationFrame(initHanziWriter);
});

// ════════════════════════════════════════════════
// IOS AUDIO UNLOCK
// ════════════════════════════════════════════════
// iOS bloque tout audio sans geste utilisateur préalable.
// On déverrouille le contexte audio au premier toucher.
(function(){
  function unlock(){
    try{
      var ctx=new(window.AudioContext||window.webkitAudioContext)();
      var buf=ctx.createBuffer(1,1,22050);
      var src=ctx.createBufferSource();
      src.buffer=buf;src.connect(ctx.destination);src.start(0);
      setTimeout(function(){ctx.close();},200);
    }catch(e){}
  }
  document.addEventListener('touchend',function onTouch(){
    unlock();
    document.removeEventListener('touchend',onTouch);
  });
})();

function handleAndroidBack(){
  if(document.getElementById('stats-overlay').classList.contains('open')){closeStats();return;}
  if(document.getElementById('settings-overlay').classList.contains('open')){closeSettings();return;}
  if(document.getElementById('word-sheet-overlay').classList.contains('open')){closeWordSheet();return;}
  if(document.getElementById('modal-overlay').classList.contains('open')){closeModal();return;}
  if(document.getElementById('write-view').classList.contains('active')){closeWrite();return;}
  if(document.getElementById('quiz-view').classList.contains('active')){
    if(inQuizMid())openModal(goHome);else goHome();return;
  }
  if(document.getElementById('flash-view').classList.contains('active')){
    if(inFlashMid())openModal(goHome);else goHome();return;
  }
  if(document.getElementById('sent-view').classList.contains('active')){
    if(inSentMid())openModal(goHome);else goHome();return;
  }
  goHome();
}

    handleAndroidBack();
    history.pushState({inApp:true},'');

});

  navigator.serviceWorker.register('./sw.js').catch(function(){});
