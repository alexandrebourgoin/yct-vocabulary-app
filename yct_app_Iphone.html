<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>YCT Vocab — Chinois</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#CC0000">
<style>
/* ══════════════════════════════════════════════
   TOKENS — Light
══════════════════════════════════════════════ */
:root {
  --c-bg:#F7F6F2; --c-surface:#FFFFFF; --c-border:#E8E4DC;
  --c-text:#1A1814; --c-muted:#8A8070; --c-hint:#B8B0A0;
  --c-overlay:rgba(0,0,0,.45);
  --radius:14px; --radius-sm:9px;
  --shadow:0 2px 12px rgba(0,0,0,.07);
  --topbar-bg:rgba(247,246,242,.93);

  --c1:#0F6E56; --c1-bg:#E1F5EE;
  --c2:#185FA5; --c2-bg:#E6F1FB;
  --c3:#534AB7; --c3-bg:#EEEDFE;
  --c4:#C45E00; --c4-bg:#FEF0E1;
  --c5:#A32D2D; --c5-bg:#FCEBEB;
}
/* Dark mode */
@media(prefers-color-scheme:dark){:root{
  --c-bg:#18171A; --c-surface:#242228; --c-border:#38353E;
  --c-text:#EDE9E0; --c-muted:#8A8494; --c-hint:#524E5A;
  --c-overlay:rgba(0,0,0,.6);
  --topbar-bg:rgba(24,23,26,.93);
  --shadow:0 2px 16px rgba(0,0,0,.35);
  --c1:#2CC48A; --c1-bg:#0D2A20;
  --c2:#4D9EE8; --c2-bg:#0D1E30;
  --c3:#8E88F0; --c3-bg:#19183A;
  --c4:#F59A3C; --c4-bg:#2E1A00;
  --c5:#E06060; --c5-bg:#2E0F0F;
}}
/* Manual dark override */
body.dark{
  --c-bg:#18171A; --c-surface:#242228; --c-border:#38353E;
  --c-text:#EDE9E0; --c-muted:#8A8494; --c-hint:#524E5A;
  --c-overlay:rgba(0,0,0,.6);
  --topbar-bg:rgba(24,23,26,.93);
  --shadow:0 2px 16px rgba(0,0,0,.35);
  --c1:#2CC48A; --c1-bg:#0D2A20;
  --c2:#4D9EE8; --c2-bg:#0D1E30;
  --c3:#8E88F0; --c3-bg:#19183A;
  --c4:#F59A3C; --c4-bg:#2E1A00;
  --c5:#E06060; --c5-bg:#2E0F0F;
}
body.light{
  --c-bg:#F7F6F2; --c-surface:#FFFFFF; --c-border:#E8E4DC;
  --c-text:#1A1814; --c-muted:#8A8070; --c-hint:#B8B0A0;
  --topbar-bg:rgba(247,246,242,.93);
  --shadow:0 2px 12px rgba(0,0,0,.07);
  --c1:#0F6E56; --c1-bg:#E1F5EE;
  --c2:#185FA5; --c2-bg:#E6F1FB;
  --c3:#534AB7; --c3-bg:#EEEDFE;
  --c4:#C45E00; --c4-bg:#FEF0E1;
  --c5:#A32D2D; --c5-bg:#FCEBEB;
}

/* ══════════════════════════════════════════════
   BASE
══════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--c-bg);}
body{font-family:'Georgia',serif;-webkit-tap-highlight-color:transparent;color:var(--c-text);transition:background .25s,color .25s;}

.app{min-height:100vh;max-width:640px;margin:0 auto;padding:0 0 2.5rem;}

/* Views */
.view{display:none;}
.view.active{display:block;animation:fadeUp .22s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ══════════════════════════════════════════════
   HOME
══════════════════════════════════════════════ */
.home-header{
  padding:1.4rem 1rem .9rem;
  display:flex;align-items:center;gap:10px;
}
.home-logo{font-size:28px;}
.home-title{font-size:22px;font-weight:700;letter-spacing:-.5px;}
.home-sub{font-size:13px;color:var(--c-muted);margin-top:2px;}
.streak-badge{
  display:inline-flex;align-items:center;gap:3px;margin-top:4px;
  font-size:11px;font-weight:700;color:var(--c-muted);
}
.streak-badge.active{color:#E07020;}
.streak-num{font-size:13px;}
.home-dark-btn{
  margin-left:auto;background:none;border:1.5px solid var(--c-border);
  border-radius:var(--radius-sm);padding:7px 10px;font-size:16px;cursor:pointer;
  min-height:38px;min-width:38px;transition:background .12s;color:var(--c-text);
}
.home-dark-btn:active{background:var(--c-border);}
.theme-seg{display:flex;gap:6px;margin-bottom:.9rem;}
.theme-btn{
  flex:1;padding:9px 4px;font-size:13px;font-weight:600;
  border:1.5px solid var(--c-border);border-radius:var(--radius-sm);
  background:var(--c-bg);color:var(--c-muted);cursor:pointer;
  font-family:inherit;transition:background .12s,color .12s,border-color .12s;
}
.theme-btn.active{background:var(--c-text);color:var(--c-bg);border-color:var(--c-text);}
.bg-seg,.surf-seg{display:flex;gap:5px;margin-bottom:.9rem;}
.bg-btn,.surf-btn{
  flex:1;padding:7px 3px;font-size:10px;font-weight:600;
  border:1.5px solid var(--c-border);border-radius:var(--radius-sm);
  background:var(--c-surface);color:var(--c-muted);cursor:pointer;
  font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:5px;
  transition:border-color .15s,color .15s;
}
.bg-btn.active,.surf-btn.active{border-color:var(--c-text);color:var(--c-text);}
.bg-btn:active,.surf-btn:active{opacity:.7;}
.bg-swatch{width:18px;height:18px;border-radius:50%;border:1.5px solid #ccc;display:block;flex-shrink:0;}
.surf-swatch{width:18px;height:18px;border-radius:4px;border:1.5px solid #ccc;display:block;flex-shrink:0;}

/* Home global search */
.home-search-wrap{
  position:relative;padding:.35rem .75rem .5rem;
}
.home-search-bar{
  width:100%;padding:10px 36px 10px 36px;font-size:15px;
  border:1.5px solid var(--c-border);border-radius:var(--radius-sm);
  background:var(--c-surface);color:var(--c-text);font-family:inherit;
  transition:border-color .15s;
}
.home-search-bar:focus{outline:none;border-color:var(--c-text);}
.home-search-icon{
  position:absolute;left:1.35rem;top:50%;transform:translateY(-50%);
  font-size:15px;color:var(--c-hint);pointer-events:none;
}
.home-search-clear{
  position:absolute;right:1.35rem;top:50%;transform:translateY(-50%);
  background:none;border:none;font-size:16px;color:var(--c-hint);
  cursor:pointer;padding:4px;display:none;
}
.home-search-clear.visible{display:block;}
/* Search results */
.gsearch-results{display:none;padding:0 .75rem .5rem;flex-direction:column;gap:6px;}
.gsearch-results.active{display:flex;}
.gsearch-count{font-size:11px;color:var(--c-muted);padding:.1rem 0 .35rem;font-weight:600;}
.gsearch-item{
  background:var(--c-surface);border:1.5px solid var(--c-border);
  border-radius:var(--radius-sm);padding:.55rem .75rem;
  display:flex;align-items:center;gap:10px;cursor:pointer;
  transition:background .1s,transform .1s;-webkit-user-select:none;user-select:none;
}
.gsearch-item:active{transform:scale(.985);}
.gsearch-hanzi{font-size:26px;line-height:1.1;min-width:36px;text-align:center;flex-shrink:0;}
.gsearch-info{flex:1;min-width:0;}
.gsearch-pinyin{font-size:11px;color:var(--c-muted);}
.gsearch-fr{font-size:13px;font-weight:600;color:var(--c-text);}
.gsearch-cat{font-size:10px;color:var(--c-hint);}
.gsearch-lvl{font-size:10px;font-weight:700;padding:2px 7px;border-radius:12px;flex-shrink:0;white-space:nowrap;}
.gsearch-empty{
  text-align:center;padding:2rem 1rem;color:var(--c-hint);
  font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px;
}
.gsearch-empty-icon{font-size:28px;}
.levels-list{padding:0 .75rem;display:flex;flex-direction:column;gap:10px;}

.level-card{
  background:var(--c-surface);border:1.5px solid var(--c-border);
  border-radius:var(--radius);padding:.75rem 1rem .7rem;
  box-shadow:var(--shadow);transition:transform .13s;
}
.level-card:active{transform:scale(.985);}
.lc-top{display:flex;align-items:center;gap:10px;margin-bottom:.5rem;}
.lc-icon{font-size:22px;line-height:1;}
.lc-info{flex:1;min-width:0;}
.lc-name{font-size:16px;font-weight:700;}
.lc-desc{font-size:12px;color:var(--c-muted);}
.lc-pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap;}

.lc-btns{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;}
.lc-btn{
  padding:10px 4px;font-size:12px;font-weight:600;
  border:1.5px solid var(--c-border);border-radius:var(--radius-sm);
  background:var(--c-bg);color:var(--c-text);cursor:pointer;
  min-height:44px;transition:background .12s,transform .1s;
  display:flex;align-items:center;justify-content:center;gap:4px;
  font-family:inherit;
}
.lc-btn:active{transform:scale(.97);}
.lc-btn.accent{border-color:var(--lc);color:var(--lc);background:var(--lc-bg);}

/* Daily section (Express / Favoris) */
.daily-section{padding:.55rem .75rem .2rem;display:flex;gap:8px;}
.daily-btn{
  flex:1;background:var(--c-surface);border:1.5px solid var(--c-border);
  border-radius:var(--radius);padding:.6rem .75rem;
  display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  cursor:pointer;font-family:inherit;transition:transform .12s,background .12s;
  text-align:left;position:relative;
}
.daily-btn:active{transform:scale(.97);}
.daily-btn-icon{font-size:20px;line-height:1.1;}
.daily-btn-label{font-size:12px;font-weight:700;color:var(--c-text);}
.daily-btn-sub{font-size:10px;color:var(--c-muted);}
.daily-btn-badge{
  position:absolute;top:7px;right:8px;
  min-width:18px;height:18px;padding:0 4px;
  border-radius:9px;font-size:10px;font-weight:700;color:#fff;
  display:none;align-items:center;justify-content:center;
}
.daily-btn-badge.show{display:flex;}
.daily-btn.express .daily-btn-icon{color:var(--c4);}
.daily-btn.express .daily-btn-badge{background:var(--c4);}
.daily-btn.favs .daily-btn-icon{color:var(--c5);}
.daily-btn.favs .daily-btn-badge{background:var(--c5);}
/* Fav button in word sheet */
.ws-fav-btn{
  display:block;width:100%;margin-bottom:.65rem;
  padding:9px;font-size:13px;font-family:inherit;font-weight:600;
  background:none;border:1.5px solid var(--c-border);border-radius:var(--radius-sm);
  color:var(--c-muted);cursor:pointer;transition:all .15s;
}
.ws-fav-btn.is-fav{border-color:#E0A020;color:#E0A020;background:rgba(224,160,32,.08);}
.ws-fav-btn:active{opacity:.7;}

/* ══════════════════════════════════════════════
   TOPBAR
══════════════════════════════════════════════ */
.topbar{
  position:sticky;top:0;z-index:10;
  background:var(--topbar-bg);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--c-border);
  display:flex;align-items:center;gap:8px;
  padding:.65rem .85rem;
  transition:background .25s;
}
.back-btn{
  background:var(--c-surface);border:1.5px solid var(--c-border);
  border-radius:var(--radius-sm);padding:7px 11px;
  font-size:13px;color:var(--c-text);cursor:pointer;min-height:40px;
  white-space:nowrap;transition:background .12s;font-family:inherit;
}
.back-btn:active{background:var(--c-border);}
.topbar-title{font-size:15px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar-badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.topbar-actions{display:flex;gap:6px;flex-shrink:0;}
.topbar-icon-btn{
  background:var(--c-surface);border:1.5px solid var(--c-border);
  border-radius:var(--radius-sm);padding:6px 9px;font-size:14px;
  cursor:pointer;min-height:36px;transition:background .12s;color:var(--c-text);
}
.topbar-icon-btn:active{background:var(--c-border);}
.topbar-icon-btn.active-toggle{background:var(--lc-bg);border-color:var(--lc);color:var(--lc);}

/* ══════════════════════════════════════════════
   VOCAB
══════════════════════════════════════════════ */
.vocab-body{padding:.8rem .75rem 0;}
.search-wrap{position:relative;margin-bottom:.5rem;}
.search-bar{
  width:100%;padding:10px 36px 10px 12px;font-size:16px; /* 16px min évite le zoom iOS au focus */
  border:1.5px solid var(--c-border);border-radius:var(--radius-sm);
  background:var(--c-surface);color:var(--c-text);font-family:inherit;
  transition:border-color .15s;
}
.search-bar:focus{outline:none;border-color:var(--lc);}
.search-clear{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:none;border:none;font-size:16px;color:var(--c-hint);
  cursor:pointer;padding:4px;display:none;
}
.search-clear.visible{display:block;}

.cat-scroll{overflow-x:auto;display:flex;gap:6px;padding-bottom:.5rem;scrollbar-width:none;}
.cat-scroll::-webkit-scrollbar{display:none;}
.cat-pill{
  flex-shrink:0;padding:5px 12px;font-size:12px;font-weight:600;
  border:1.5px solid var(--c-border);border-radius:20px;
  background:var(--c-surface);color:var(--c-muted);cursor:pointer;
  transition:all .13s;white-space:nowrap;min-height:32px;font-family:inherit;
}
.cat-pill.active{background:var(--lc-bg);border-color:var(--lc);color:var(--lc);}

.vocab-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem;}
.count{font-size:12px;color:var(--c-muted);}
.hint-speak{font-size:12px;color:var(--c-hint);}

.vocab-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding-bottom:1rem;}
@media(min-width:480px){.vocab-grid{grid-template-columns:repeat(3,1fr);}}

.vocab-card{
  border:1.5px solid var(--c-border);border-radius:var(--radius-sm);
  padding:10px 10px 8px;background:var(--c-surface);cursor:pointer;
  transition:background .1s,border-color .1s,transform .1s;
  -webkit-user-select:none;user-select:none;
}
.vocab-card:active{transform:scale(.97);}
.vocab-card.speaking{border-color:var(--c1);background:var(--c1-bg);}
.vc-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:3px;}
.v-hanzi{font-size:26px;line-height:1.25;color:var(--c-text);}
.v-hanzi.big{font-size:32px;}
.v-hanzi.small{font-size:20px;}
.v-sound{font-size:15px;opacity:.55;margin-top:3px;flex-shrink:0;}
.vocab-card.speaking .v-sound{opacity:1;}
.v-pinyin{font-size:11px;color:var(--c-muted);transition:opacity .2s;}
.v-pinyin.hidden{opacity:0;}
.v-fr{font-size:12px;color:var(--c-text);font-weight:600;}
.v-cat{font-size:10px;color:var(--c-hint);margin-top:2px;}

/* ══════════════════════════════════════════════
   FLASH CARDS
══════════════════════════════════════════════ */
.flash-body{padding:.8rem .75rem;}
.flash-wrap{max-width:480px;margin:0 auto;}
.flash-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--c-muted);margin-bottom:.85rem;}

.flash-scene{perspective:1000px;margin-bottom:1rem;cursor:pointer;}
.flash-card-3d{
  position:relative;width:100%;min-height:220px;
  transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,0,.2,1);
  border-radius:var(--radius);
}
.flash-card-3d.flipped{transform:rotateY(180deg);}
.flash-face{
  position:absolute;inset:0;
  border:1.5px solid var(--c-border);border-radius:var(--radius);
  background:var(--c-surface);box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:1.5rem 1rem;text-align:center;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
}
.flash-face.back{transform:rotateY(180deg);}
.flash-face-label{font-size:11px;color:var(--c-hint);margin-bottom:.75rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;}
.flash-hanzi{font-size:64px;line-height:1.1;margin-bottom:.5rem;}
.flash-pinyin{font-size:15px;color:var(--c-muted);margin-bottom:.25rem;}
.flash-fr{font-size:20px;font-weight:700;margin-bottom:.3rem;}
.flash-cat{font-size:12px;color:var(--c-hint);}
.flash-tap-hint{font-size:12px;color:var(--c-hint);margin-top:.5rem;}

.flash-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.75rem;}
.flash-btn{
  padding:13px 8px;font-size:14px;font-weight:700;
  border:1.5px solid var(--c-border);border-radius:var(--radius-sm);
  cursor:pointer;min-height:50px;font-family:inherit;transition:transform .1s,background .12s;
}
.flash-btn:active{transform:scale(.97);}
.flash-btn.fail{background:var(--c5-bg);color:var(--c5);border-color:var(--c5);}
.flash-btn.pass{background:var(--c1-bg);color:var(--c1);border-color:var(--c1);}

.flash-progress{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:.5rem;}
.fp-dot{width:8px;height:8px;border-radius:50%;background:var(--c-border);transition:background .2s;}
.fp-dot.ok{background:var(--c1);}
.fp-dot.ko{background:var(--c5);}
.fp-dot.cur{background:var(--c-muted);}

/* ══════════════════════════════════════════════
   QUIZ
══════════════════════════════════════════════ */
.quiz-body{padding:.8rem .75rem;}
.quiz-wrap{max-width:480px;margin:0 auto;}
.qpbar{height:5px;background:var(--c-border);border-radius:3px;margin-bottom:.9rem;overflow:hidden;}
.qpfill{height:100%;border-radius:3px;background:var(--lc);transition:width .4s ease;}
.qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--c-muted);margin-bottom:.9rem;align-items:center;}
.streak{font-size:13px;font-weight:700;color:#F59A3C;min-width:60px;text-align:right;transition:opacity .3s;}
.streak.hidden{opacity:0;}

.qcard{
  background:var(--c-surface);border:1.5px solid var(--c-border);
  border-radius:var(--radius);padding:1.4rem 1rem 1.1rem;
  text-align:center;margin-bottom:.9rem;box-shadow:var(--shadow);
}
.q-hanzi{font-size:54px;line-height:1.15;margin-bottom:6px;}
.q-fr-prompt{font-size:22px;font-weight:700;line-height:1.3;margin-bottom:6px;color:var(--c-text);}
.q-sound-btn{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--c-bg);border:1.5px solid var(--c-border);border-radius:20px;
  padding:5px 12px;font-size:12px;color:var(--c-muted);cursor:pointer;
  margin-bottom:.4rem;transition:background .12s;font-family:inherit;
}
.q-sound-btn:active{background:var(--c-border);}
.q-sound-btn.playing{border-color:var(--c1);color:var(--c1);}
.q-pinyin{font-size:14px;color:var(--c-muted);}
.q-lbl{font-size:12px;color:var(--c-hint);margin-top:4px;}

.qopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.7rem;}
.qopt{
  padding:13px 10px;font-size:14px;
  border:1.5px solid var(--c-border);border-radius:var(--radius-sm);
  background:var(--c-surface);color:var(--c-text);cursor:pointer;
  text-align:center;line-height:1.3;min-height:50px;
  transition:background .1s,border-color .1s,transform .1s;font-family:inherit;
}
.qopt:active:not(.disabled){transform:scale(.97);}
.qopt.correct{background:var(--c1-bg);border-color:var(--c1);color:var(--c1);font-weight:700;}
.qopt.wrong{background:var(--c5-bg);border-color:var(--c5);color:var(--c5);}
.qopt.disabled{cursor:default;}

.qfb{font-size:14px;font-weight:600;margin-bottom:.7rem;text-align:center;min-height:20px;}
.qnext{
  width:100%;padding:13px;font-size:15px;font-weight:700;
  border:none;border-radius:var(--radius-sm);
  background:var(--c-text);color:var(--c-bg);cursor:pointer;
  min-height:50px;font-family:inherit;transition:transform .1s,opacity .12s;
}
.qnext:active{transform:scale(.98);}

/* ══════════════════════════════════════════════
   SENTENCES
══════════════════════════════════════════════ */
.sent-sentence{font-size:26px;line-height:1.6;margin-bottom:.6rem;word-break:keep-all;}
.sent-blank{
  display:inline-block;min-width:2.2em;border-bottom:2.5px solid var(--lc);
  color:var(--lc);font-weight:700;text-align:center;
  vertical-align:bottom;margin:0 3px;transition:color .2s,background .2s,border-color .2s;
}
.sent-blank.filled{
  border-bottom-color:transparent;padding:0 5px;
  border-radius:5px;background:var(--lc-bg);
}
.sent-fr{font-size:13px;color:var(--c-muted);font-style:italic;line-height:1.4;margin-top:.2rem;}

/* ══════════════════════════════════════════════
   DICTÉE
══════════════════════════════════════════════ */
.dict-listen-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  width:112px;height:112px;border-radius:50%;
  border:2.5px solid var(--lc);background:var(--lc-bg);color:var(--lc);
  cursor:pointer;margin:.2rem auto .8rem;font-family:inherit;
  transition:transform .12s,background .15s,color .15s;
}
.dict-listen-btn:active{transform:scale(.93);}
.dict-listen-btn.playing{background:var(--lc);color:#fff;}
.dict-snd-icon{font-size:38px;line-height:1;}
.dict-snd-lbl{font-size:12px;font-weight:700;}

/* ══════════════════════════════════════════════
   ASSOCIATION
══════════════════════════════════════════════ */
.assoc-area{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.75rem;}
.assoc-col{display:flex;flex-direction:column;gap:8px;}
.assoc-card{
  padding:11px 6px;border:1.5px solid var(--c-border);
  border-radius:var(--radius-sm);background:var(--c-surface);
  cursor:pointer;text-align:center;min-height:54px;
  display:flex;align-items:center;justify-content:center;line-height:1.3;
  transition:background .12s,border-color .12s,color .12s,transform .1s;
  font-family:inherit;color:var(--c-text);
  -webkit-user-select:none;user-select:none;
}
.assoc-card.h-card{font-size:24px;}
.assoc-card.fr-card{font-size:12px;font-weight:600;}
.assoc-card:active:not(.matched):not(.wrong){transform:scale(.96);}
.assoc-card.selected{background:var(--lc-bg);border-color:var(--lc);color:var(--lc);}
.assoc-card.matched{background:var(--c1-bg);border-color:var(--c1);color:var(--c1);cursor:default;pointer-events:none;}
.assoc-card.wrong{background:var(--c5-bg);border-color:var(--c5);color:var(--c5);}

/* Stars result */
.stars-row{display:flex;justify-content:center;gap:6px;margin:8px 0;}
.star{font-size:32px;opacity:.2;transition:opacity .4s,transform .4s;}
.star.lit{opacity:1;transform:scale(1.2);}

/* ══════════════════════════════════════════════
   RESULTS
══════════════════════════════════════════════ */
.rcard{
  background:var(--c-surface);border:1.5px solid var(--c-border);
  border-radius:var(--radius);padding:1.6rem 1rem 1.4rem;
  text-align:center;margin-bottom:1rem;box-shadow:var(--shadow);
}
.remoji{font-size:38px;margin-bottom:.4rem;}
.rscore{font-size:54px;font-weight:700;line-height:1;}
.rscore span{font-size:22px;color:var(--c-muted);}
.rtotal{font-size:13px;color:var(--c-muted);margin:.35rem 0 .6rem;}
.rmsg{font-size:15px;font-weight:600;margin-bottom:1rem;}
.ractns{display:flex;gap:8px;flex-wrap:wrap;}
.ractns button{
  flex:1;min-width:90px;padding:11px 6px;font-size:12px;font-weight:600;
  border:1.5px solid var(--c-border);border-radius:var(--radius-sm);
  background:var(--c-bg);color:var(--c-text);cursor:pointer;min-height:44px;
  font-family:inherit;transition:background .12s;
}
.ractns button:active{background:var(--c-border);}
.ractns button.cta{background:var(--c-text);color:var(--c-bg);border-color:var(--c-text);}
.wrong-section{margin-top:1rem;}
.wrong-title{font-size:13px;font-weight:700;margin-bottom:.5rem;color:var(--c-muted);}
.rb-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--c-border);font-size:12px;}
.rb-h{font-size:22px;min-width:38px;cursor:pointer;}
.rb-pin{font-size:11px;color:var(--c-hint);min-width:70px;}
.rb-fr{flex:1;color:var(--c-muted);}
.rb-x{color:var(--c5);font-size:14px;}

/* ══════════════════════════════════════════════
   STATS
══════════════════════════════════════════════ */
.stats-overlay{
  position:fixed;inset:0;background:var(--c-bg);z-index:200;
  display:none;overflow-y:auto;
}
.stats-overlay.open{display:block;animation:fadeUp .22s ease both;}
.stats-header{
  display:flex;align-items:center;gap:10px;
  padding:1rem 1rem .75rem;
  position:sticky;top:0;z-index:1;
  background:var(--topbar-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--c-border);
}
.stats-back{
  background:none;border:1.5px solid var(--c-border);border-radius:var(--radius-sm);
  padding:6px 10px;font-size:14px;cursor:pointer;color:var(--c-text);font-family:inherit;
  min-height:36px;transition:background .12s;
}
.stats-back:active{background:var(--c-border);}
.stats-title{font-size:17px;font-weight:700;}
.stats-body{padding:.75rem;max-width:640px;margin:0 auto;}
.stats-level{
  background:var(--c-surface);border:1.5px solid var(--c-border);
  border-radius:var(--radius);padding:.85rem 1rem .75rem;
  box-shadow:var(--shadow);margin-bottom:.75rem;
}
.stats-grid{
  display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:.6rem;
}
.stats-cell{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border-radius:var(--radius-sm);
  background:var(--c-bg);
}
.stats-cell.done{background:var(--lc-bg);}
.stats-cell-icon{font-size:17px;line-height:1;}
.stats-cell-label{font-size:8px;color:var(--c-muted);font-weight:600;text-align:center;line-height:1.2;}
.stats-cell-score{font-size:11px;font-weight:700;color:var(--c-hint);}
.stats-cell.done .stats-cell-score{color:var(--lc);}
.stats-empty{text-align:center;padding:3rem 1rem;color:var(--c-muted);}
.stats-empty-icon{font-size:40px;margin-bottom:.5rem;}

/* ══════════════════════════════════════════════
   MODAL
══════════════════════════════════════════════ */
.modal-overlay{
  position:fixed;inset:0;background:var(--c-overlay);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{
  background:var(--c-surface);border-radius:var(--radius) var(--radius) 0 0;
  padding:1.4rem 1.2rem 2rem;width:100%;max-width:480px;
  transform:translateY(30px);transition:transform .22s;
}
.modal-overlay.open .modal{transform:none;}
.modal-title{font-size:17px;font-weight:700;margin-bottom:.4rem;}
.modal-sub{font-size:14px;color:var(--c-muted);margin-bottom:1.2rem;}
.modal-btns{display:flex;flex-direction:column;gap:8px;}
.modal-btns button{
  padding:13px;font-size:15px;font-weight:600;border-radius:var(--radius-sm);
  border:1.5px solid var(--c-border);cursor:pointer;font-family:inherit;
  background:var(--c-bg);color:var(--c-text);
}
.modal-btn-stay{background:var(--c-text)!important;color:var(--c-bg)!important;border-color:var(--c-text)!important;}

/* ══════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════ */
.empty{text-align:center;padding:2.5rem 1rem;color:var(--c-hint);}
.empty-icon{font-size:34px;margin-bottom:.5rem;}
@media(max-width:400px){
  .qopts{grid-template-columns:1fr;}
  .q-hanzi{font-size:44px;}
  .ractns{flex-direction:column;}
  .flash-hanzi{font-size:52px;}
  .lc-btns{grid-template-columns:repeat(2,1fr);gap:6px;}
}

/* ══════════════════════════════════════════════
   IOS — safe areas & compatibilité
══════════════════════════════════════════════ */
html{height:-webkit-fill-available;}
body{min-height:-webkit-fill-available;}

/* Notch / Dynamic Island : padding haut des barres */
.home-header{padding-top:calc(1.4rem + env(safe-area-inset-top,0px));}
.topbar{padding-top:calc(.65rem + env(safe-area-inset-top,0px));}
.write-topbar{padding-top:calc(.65rem + env(safe-area-inset-top,0px));}

/* Home indicator (bas d'écran) */
.app{padding-bottom:max(2.5rem, env(safe-area-inset-bottom,0px));}
.modal{padding-bottom:max(2rem, env(safe-area-inset-bottom,0px));}
.word-sheet{padding-bottom:max(2.2rem, env(safe-area-inset-bottom,0px));}
.write-body{padding-bottom:max(1.5rem, env(safe-area-inset-bottom,0px));}

/* ══════════════════════════════════════════════
   LEVEL COLORS  (--lc / --lc-bg per context)
══════════════════════════════════════════════ */
.l1{--lc:var(--c1);--lc-bg:var(--c1-bg);}
.l2{--lc:var(--c2);--lc-bg:var(--c2-bg);}
.l3{--lc:var(--c3);--lc-bg:var(--c3-bg);}
.l4{--lc:var(--c4);--lc-bg:var(--c4-bg);}
.l5{--lc:var(--c5);--lc-bg:var(--c5-bg);}
.lc-pill,.topbar-badge,.cat-pill.active{background:var(--lc-bg);color:var(--lc);}
.lc-btn.accent{color:var(--lc);background:var(--lc-bg);border-color:var(--lc);}

/* ══════════════════════════════════════════════
   WORD ACTION SHEET
══════════════════════════════════════════════ */
.word-sheet-overlay{
  position:fixed;inset:0;background:var(--c-overlay);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.word-sheet-overlay.open{opacity:1;pointer-events:all;}
.word-sheet{
  background:var(--c-surface);border-radius:var(--radius) var(--radius) 0 0;
  padding:1.4rem 1.2rem 2.2rem;width:100%;max-width:480px;
  transform:translateY(30px);transition:transform .22s;
  text-align:center;
}
.word-sheet-overlay.open .word-sheet{transform:none;}
.ws-hanzi{font-size:72px;line-height:1.1;margin-bottom:.3rem;letter-spacing:-.02em;}
.ws-pinyin{font-size:15px;color:var(--c-muted);margin-bottom:.2rem;}
.ws-fr{font-size:16px;font-weight:700;margin-bottom:1.3rem;color:var(--c-text);}
.ws-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ws-btns button{
  padding:15px 8px;font-size:15px;font-weight:700;
  border:1.5px solid var(--c-border);border-radius:var(--radius-sm);
  background:var(--c-bg);color:var(--c-text);cursor:pointer;
  min-height:56px;font-family:inherit;transition:background .12s,transform .1s;
}
.ws-btns button:active{transform:scale(.97);}
.ws-btn-write{background:var(--lc-bg)!important;color:var(--lc)!important;border-color:var(--lc)!important;}

/* ══════════════════════════════════════════════
   WRITE VIEW
══════════════════════════════════════════════ */
#write-view{
  position:fixed;inset:0;z-index:50;
  display:none;flex-direction:column;
  background:var(--c-bg);
}
#write-view.wv-open{display:flex;animation:fadeUp .2s ease both;}
.write-topbar{
  display:flex;align-items:center;gap:8px;
  padding:.65rem .85rem;
  background:var(--topbar-bg);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--c-border);
  flex-shrink:0;transition:background .25s;
}
.write-word-info{flex:1;text-align:center;min-width:0;overflow:hidden;}
.write-word-hanzi{font-size:20px;font-weight:700;line-height:1.2;}
.write-word-sub{font-size:11px;color:var(--c-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.write-body{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:1rem .75rem 1.5rem;gap:.9rem;
  overflow:hidden;
}
.write-hw-wrap{
  position:relative;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
  flex-shrink:0;
  background:var(--c-surface);
  border:1.5px solid var(--c-border);
  touch-action:none;
}
.write-hw-wrap svg,.write-hw-wrap canvas{display:block;}

/* Char nav for multi-char words */
.write-char-nav{
  display:flex;align-items:center;gap:12px;
}
.write-char-btn{
  background:var(--c-surface);border:1.5px solid var(--c-border);
  border-radius:var(--radius-sm);padding:6px 12px;
  font-size:13px;color:var(--c-text);cursor:pointer;min-height:36px;
  font-family:inherit;transition:background .12s;
}
.write-char-btn:active{background:var(--c-border);}
.write-char-btn:disabled{opacity:.35;cursor:default;}
.write-char-label{
  font-size:13px;color:var(--c-muted);font-weight:600;white-space:nowrap;
}

/* Status bar */
.write-status-row{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
}
.write-status{
  font-size:13px;color:var(--c-muted);text-align:center;
  min-height:20px;transition:color .2s;
}
.write-status.ok{color:var(--c1);}
.write-status.err{color:var(--c5);}

/* Stroke dots */
.write-stroke-dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;}
.wsd{
  width:9px;height:9px;border-radius:50%;
  background:var(--c-border);transition:background .25s,transform .2s;
  flex-shrink:0;
}
.wsd.done{background:var(--lc);transform:scale(1.1);}
.wsd.active{background:var(--c-muted);}
.wsd.err{background:var(--c5);}

/* Bottom actions */
.write-actions{display:flex;gap:8px;}
.write-action-btn{
  padding:10px 18px;font-size:13px;font-weight:600;
  border:1.5px solid var(--c-border);border-radius:var(--radius-sm);
  background:var(--c-bg);color:var(--c-text);cursor:pointer;
  min-height:42px;font-family:inherit;transition:background .12s,transform .1s;
}
.write-action-btn:active{transform:scale(.97);}
.write-action-btn.accent{background:var(--lc-bg);color:var(--lc);border-color:var(--lc);}

/* Error shake */
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.write-hw-wrap.shake{animation:shake .25s ease;}
</style>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>

</head>
<body>
<div class="app">

  <!-- ── HOME ──────────────────────────────── -->
  <div id="home" class="view active">
    <div class="home-header">
      <span class="home-logo">🀄</span>
      <div>
        <div class="home-title">YCT Vocab</div>
        <div class="home-sub">Vocabulaire chinois — 5 niveaux</div>
        <div class="streak-badge" id="streak-badge"></div>
      </div>
      <button class="home-dark-btn" id="settings-btn" title="Paramètres">⚙️</button>
    </div>
    <div class="daily-section">
      <button class="daily-btn express" id="btn-express" onclick="startExpress()">
        <span class="daily-btn-icon">⚡</span>
        <span class="daily-btn-label">Révision Express</span>
        <span class="daily-btn-sub" id="express-sub">Chargement…</span>
        <span class="daily-btn-badge" id="express-badge"></span>
      </button>
      <button class="daily-btn favs" id="btn-favs" onclick="startFavsSession()">
        <span class="daily-btn-icon">⭐</span>
        <span class="daily-btn-label">Mots Difficiles</span>
        <span class="daily-btn-sub" id="favs-sub">Mes favoris</span>
        <span class="daily-btn-badge" id="favs-badge"></span>
      </button>
    </div>
    <div class="home-search-wrap">
      <span class="home-search-icon">🔍</span>
      <input class="home-search-bar" id="home-search" type="search" placeholder="Rechercher dans tous les niveaux…" autocomplete="off"/>
      <button class="home-search-clear" id="home-search-clear" aria-label="Effacer">✕</button>
    </div>
    <div class="gsearch-results" id="gsearch-results"></div>
    <div class="levels-list" id="home-cards"></div>
  </div>

  <!-- ── VOCAB ─────────────────────────────── -->
  <div id="vocab-view" class="view">
    <div class="topbar" id="vocab-topbar">
      <button class="back-btn" id="vocab-back">← Retour</button>
      <span class="topbar-title" id="view-title"></span>
      <div class="topbar-actions">
        <button class="topbar-icon-btn" id="pinyin-toggle" title="Masquer pinyin">pīn</button>
        <button class="topbar-icon-btn" id="size-toggle" title="Taille hanzi">A+</button>
        <span class="topbar-badge" id="view-badge"></span>
      </div>
    </div>
    <div class="vocab-body">
      <div class="search-wrap">
        <input class="search-bar" id="search" type="search" placeholder="Rechercher..." autocomplete="off"/>
        <button class="search-clear" id="search-clear" aria-label="Effacer">✕</button>
      </div>
      <div class="cat-scroll" id="cat-scroll"></div>
      <div class="vocab-meta">
        <span class="count" id="count-label"></span>
        <span class="hint-speak">🔊 Appuyer pour écouter</span>
      </div>
      <div class="vocab-grid" id="vocab-grid"></div>
    </div>
  </div>

  <!-- ── FLASH CARDS ───────────────────────── -->
  <div id="flash-view" class="view">
    <div class="topbar" id="flash-topbar">
      <button class="back-btn" id="flash-back">← Retour</button>
      <span class="topbar-title" id="flash-title"></span>
      <span class="topbar-badge" id="flash-badge"></span>
    </div>
    <div class="flash-body">
      <div class="flash-wrap" id="flash-body"></div>
    </div>
  </div>

  <!-- ── QUIZ ──────────────────────────────── -->
  <div id="quiz-view" class="view">
    <div class="topbar" id="quiz-topbar">
      <button class="back-btn" id="quiz-back">← Retour</button>
      <span class="topbar-title" id="quiz-title"></span>
      <span class="topbar-badge" id="quiz-badge"></span>
    </div>
    <div class="quiz-body">
      <div class="quiz-wrap" id="quiz-body"></div>
    </div>
  </div>

  <!-- ── PHRASES ──────────────────────────── -->
  <div id="sent-view" class="view">
    <div class="topbar" id="sent-topbar">
      <button class="back-btn" id="sent-back">← Retour</button>
      <span class="topbar-title" id="sent-title"></span>
      <span class="topbar-badge" id="sent-badge"></span>
    </div>
    <div class="quiz-body">
      <div class="quiz-wrap" id="sent-body"></div>
    </div>
  </div>

</div>

<!-- ── WRITE VIEW ──────────────────────────── -->
<div id="write-view">
  <div class="write-topbar" id="write-topbar">
    <button class="back-btn" id="write-back">← Retour</button>
    <div class="write-word-info">
      <div class="write-word-hanzi" id="write-word-hanzi"></div>
      <div class="write-word-sub" id="write-word-sub"></div>
    </div>
    <button class="topbar-icon-btn" id="write-replay" title="Revoir l'animation">▶</button>
  </div>
  <div class="write-body" id="write-body">
    <!-- char nav (multi-char words) -->
    <div class="write-char-nav" id="write-char-nav" style="display:none">
      <button class="write-char-btn" id="write-prev">‹</button>
      <span class="write-char-label" id="write-char-label"></span>
      <button class="write-char-btn" id="write-next">›</button>
    </div>
    <!-- HanziWriter target -->
    <div class="write-hw-wrap" id="write-hw-wrap">
      <div id="hanzi-writer-target"></div>
    </div>
    <!-- Stroke progress dots -->
    <div class="write-stroke-dots" id="write-stroke-dots"></div>

    <div class="write-status" id="write-status">Chargement…</div>
    <!-- Action buttons -->
    <div class="write-actions">
      <button class="write-action-btn" id="write-hint-btn">💡 Indice</button>
      <button class="write-action-btn accent" id="write-retry-btn">↺ Recommencer</button>

  </div>
</div>

<!-- Word action sheet -->
<div class="word-sheet-overlay" id="word-sheet-overlay">
  <div class="word-sheet" id="word-sheet">
    <div class="ws-hanzi" id="ws-hanzi"></div>
    <div class="ws-pinyin" id="ws-pinyin"></div>
    <div class="ws-fr" id="ws-fr"></div>
    <div id="ws-radicals" style="display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:1rem;min-height:1.2em"></div>
    <button class="ws-fav-btn" id="ws-fav">⭐ Ajouter aux favoris</button>
    <div class="ws-btns">
      <button id="ws-listen">🔊 Écouter</button>
      <button class="ws-btn-write" id="ws-write">✏️ Écrire</button>
    </div>
  </div>
</div>

<!-- Stats overlay -->
<div class="stats-overlay" id="stats-overlay">
  <div class="stats-header">
    <button class="stats-back" id="stats-close">← Retour</button>
    <span class="stats-title">📊 Statistiques</span>
  </div>
  <div class="stats-body" id="stats-body"></div>
</div>

<!-- Settings sheet -->
<div class="modal-overlay" id="settings-overlay">
  <div class="modal">
    <div class="modal-title">⚙️ Paramètres</div>
    <div style="font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--c-muted);margin-bottom:.5rem">THÈME</div>
    <div class="theme-seg">

// AUDIO — SpeechSynthesis primary, Google TTS fallback
// ════════════════════════════════════════════════
function speak(hanzi,cardEl,btnEl){
  if(_audio){_audio.pause();_audio=null;}
  if(window.speechSynthesis)window.speechSynthesis.cancel();
  if(_card){_card.classList.remove('speaking');_card=null;}
  if(_sndBtn){_sndBtn.classList.remove('playing');_sndBtn=null;}
  if(cardEl){_card=cardEl;cardEl.classList.add('speaking');}
  if(btnEl){_sndBtn=btnEl;btnEl.classList.add('playing');}

  function done(){
    if(cardEl)cardEl.classList.remove('speaking');
    if(btnEl)btnEl.classList.remove('playing');
    if(_audio)_audio=null;
  }

  function tryGoogleTTS(){
    var url='https://translate.google.com/translate_tts?ie=UTF-8&tl=zh-CN&client=tw-ob&q='+encodeURIComponent(hanzi);
    var a=new Audio();
    a.referrerPolicy='no-referrer';
    a.src=url;
    _audio=a;
    a.onended=done;
    a.onerror=done;
    a.play().catch(done);
  }

  function doSpeechAPI(){
    var u=new SpeechSynthesisUtterance(hanzi);
    u.lang='zh-CN';u.rate=0.85;
    var voices=window.speechSynthesis.getVoices();
    var v=voices.find(function(x){return x.lang.startsWith('zh');});
    if(v)u.voice=v;
    u.onend=done;
    u.onerror=function(){tryGoogleTTS();};
    window.speechSynthesis.speak(u);
  }

  if(!window.speechSynthesis){tryGoogleTTS();return;}
  var voices=window.speechSynthesis.getVoices();
  if(voices.length){doSpeechAPI();}
  else{
    var _fallbackTimer=setTimeout(tryGoogleTTS,600);
    window.speechSynthesis.onvoiceschanged=function(){
      clearTimeout(_fallbackTimer);
      window.speechSynthesis.onvoiceschanged=null;
      doSpeechAPI();
    };
  }
}

var STREAK_KEY='yct-streak';
function _getStreak(){
  try{return JSON.parse(localStorage.getItem(STREAK_KEY)||'{"count":0,"last":""}');}
  catch(e){return{count:0,last:''};}
}
function _markToday(){
  var today=new Date().toISOString().slice(0,10);
  var s=_getStreak();
  if(s.last===today)return;
  var yest=new Date(Date.now()-86400000).toISOString().slice(0,10);
  s.count=(s.last===yest)?s.count+1:1;
  s.last=today;
  try{localStorage.setItem(STREAK_KEY,JSON.stringify(s));}catch(e){}
}
function _buildStreakBadge(){
  var s=_getStreak();
  var el=document.getElementById('streak-badge');

  if(s.count>=2){
    el.className='streak-badge active';
    el.innerHTML='🔥 <span class="streak-num">'+s.count+'</span> jour'+(s.count>1?'s':'')+' de suite';
  } else if(s.count===1){
    el.className='streak-badge active';
    el.innerHTML='🔥 1er jour !';
  } else {
    el.className='streak-badge';
    el.innerHTML='';
  }
}

// SRS — Répétition Espacée
// ════════════════════════════════════════════════
var SRS_KEY='yct-srs';
function _getSRS(){try{return JSON.parse(localStorage.getItem(SRS_KEY)||'{}');}catch(e){return {};}}
function _saveSRS(obj){try{localStorage.setItem(SRS_KEY,JSON.stringify(obj));}catch(e){}}
function _srsUpdate(h,correct){
  var srs=_getSRS();
  var e=srs[h]||{interval:1,due:null,reps:0};
  if(correct){
    e.reps=(e.reps||0)+1;
    e.interval=Math.min(Math.round((e.interval||1)*2.5),30);
  } else {
    e.interval=1;
    e.reps=0;
  }
  var d=new Date();d.setDate(d.getDate()+e.interval);
  e.due=d.toISOString().slice(0,10);
  srs[h]=e;
  _saveSRS(srs);
}
function _srsDueWords(){
  var srs=_getSRS();
  var today=new Date().toISOString().slice(0,10);
  var words=[];
  Object.keys(data).forEach(function(k){
    data[k].words.forEach(function(w){
      var e=srs[w.h];
      if(e&&e.due&&e.due<=today)words.push(w);
    });
  });
  return words;
}
function _srsNewWords(){
  var srs=_getSRS();
  var words=[];
  Object.keys(data).forEach(function(k){
    data[k].words.forEach(function(w){if(!srs[w.h])words.push(w);});
  });
  return words;
}
function _srsCount(){
  var srs=_getSRS();
  var today=new Date().toISOString().slice(0,10);
  return Object.keys(srs).filter(function(h){return srs[h].due&&srs[h].due<=today;}).length;
}

function startExpress(){
  var due=_srsDueWords();
  var newW=shuffle(_srsNewWords()).slice(0,Math.max(0,10-due.length));
  var pool=shuffle(due.concat(newW)).slice(0,20);
  if(!pool.length){
    alert('Aucun mot à réviser pour l\'instant ! Entraîne-toi d\'abord sur les niveaux.');
    return;
  }
  startQuiz('_express','normal',pool);
}
function startFavsSession(){
  var pool=_getFavWords();
  if(!pool.length){
    alert('Aucun mot favori. Appuie sur ⭐ dans la fiche d\'un mot pour l\'ajouter.');
    return;
  }
  startQuiz('_favs','normal',pool);
}

var STORE_KEY='yct-progress';
function _getProg(){
  try{return JSON.parse(localStorage.getItem(STORE_KEY)||'{}');}catch(e){return {};}
}
function _saveProg(level,mode,pct){
  var p=_getProg();
  if(!p[level])p[level]={};
  if((p[level][mode]||0)<pct)p[level][mode]=pct;
  try{localStorage.setItem(STORE_KEY,JSON.stringify(p));}catch(e){}
  _markToday();
}
function _clearProg(){
  try{localStorage.removeItem(STORE_KEY);}catch(e){}
}

// RECHERCHE GLOBALE
// ════════════════════════════════════════════════
function _globalSearch(q){
  q=q.toLowerCase().trim();
  if(!q)return[];
  var results=[];
  Object.keys(data).forEach(function(k){
    data[k].words.forEach(function(w){
      if(w.h.indexOf(q)>=0||w.p.toLowerCase().indexOf(q)>=0||w.fr.toLowerCase().indexOf(q)>=0||w.c.toLowerCase().indexOf(q)>=0){
        results.push({word:w,level:k});
      }
    });
  });
  return results;
}
function _renderGlobalResults(results,q){
  var el=document.getElementById('gsearch-results');
  var cards=document.getElementById('home-cards');
  if(!q||!q.trim()){
    el.className='gsearch-results';
    cards.style.display='';
    return;
  }
  cards.style.display='none';
  el.className='gsearch-results active';
  if(!results.length){
    el.innerHTML='<div class="gsearch-empty"><div class="gsearch-empty-icon">🔍</div>Aucun résultat pour « '+q+' »</div>';
    return;
  }
  var max=80;
  var shown=results.slice(0,max);
  var html='<div class="gsearch-count">'+results.length+' résultat'+(results.length>1?'s':'')+' dans tous les niveaux'+(results.length>max?' ('+max+' affichés)':'')+'</div>';
  shown.forEach(function(r){
    var d=data[r.level];
    html+='<div class="gsearch-item" data-hanzi="'+encodeURIComponent(r.word.h)+'" data-level="'+r.level+'">'
      +'<div class="gsearch-hanzi '+d.lc+'">'+r.word.h+'</div>'
      +'<div class="gsearch-info">'
        +'<div class="gsearch-fr">'+r.word.fr+'</div>'
        +'<div class="gsearch-pinyin">'+r.word.p+'</div>'
        +'<div class="gsearch-cat">'+r.word.c+'</div>'
      +'</div>'
      +'<span class="gsearch-lvl '+d.lc+'" style="background:var(--lc-bg);color:var(--lc)">'+d.label+'</span>'
    +'</div>';
  });
  el.innerHTML=html;
  el.querySelectorAll('.gsearch-item').forEach(function(item){
    item.addEventListener('click',function(){
      var h=decodeURIComponent(item.getAttribute('data-hanzi'));
      var lv=item.getAttribute('data-level');
      var w=(data[lv]&&data[lv].words.find(function(x){return x.h===h;}))||{h:h,p:'',fr:'',c:''};
      var prevCurrent=current;
      current=lv;
      openWordSheet(w,null);
      current=prevCurrent;
    });
  });
}
(function(){
  var inp=document.getElementById('home-search');
  var clr=document.getElementById('home-search-clear');
  if(!inp)return;
  inp.addEventListener('input',function(){
    clr.className='home-search-clear'+(this.value.length?' visible':'');
    _renderGlobalResults(_globalSearch(this.value),this.value);
  });
  clr.addEventListener('click',function(){
    inp.value='';
    clr.className='home-search-clear';
    _renderGlobalResults([],'');
    inp.focus();
  });
})();

var sizeClasses=['small','','big'];

function showLevel(level){
  current=level;activeCat='all';pinyinHidden=false;hanziSize=1;
  var d=data[level];
  var tb=document.getElementById('vocab-topbar');
  tb.className='topbar '+d.lc;
  document.getElementById('view-title').textContent=d.label;
  document.getElementById('view-badge').textContent=d.words.length+' mots';
  document.getElementById('view-badge').className='topbar-badge';
  document.getElementById('pinyin-toggle').className='topbar-icon-btn';
  document.getElementById('size-toggle').className='topbar-icon-btn';

  var cats=['all'];
  d.words.forEach(function(w){if(cats.indexOf(w.c)<0)cats.push(w.c);});
  var cs=document.getElementById('cat-scroll');
  cs.innerHTML=cats.map(function(c){
    return '<button class="cat-pill'+(c==='all'?' active':'')+'" data-cat="'+c+'">'+(c==='all'?'Tous':c)+'</button>';
  }).join('');
  cs.querySelectorAll('.cat-pill').forEach(function(pill){
    pill.addEventListener('click',function(){
      activeCat=pill.getAttribute('data-cat');
      cs.querySelectorAll('.cat-pill').forEach(function(p){p.classList.remove('active');});
      pill.classList.add('active');applyFilter();
    });
  });
  document.getElementById('search').value='';
  document.getElementById('search-clear').classList.remove('visible');
  filtered=d.words;
  show('vocab-view');
  renderVocab(filtered);
}

document.getElementById('pinyin-toggle').addEventListener('click',function(){
  pinyinHidden=!pinyinHidden;
  this.classList.toggle('active-toggle',pinyinHidden);
  document.querySelectorAll('.v-pinyin').forEach(function(el){el.classList.toggle('hidden',pinyinHidden);});
});
document.getElementById('size-toggle').addEventListener('click',function(){
  hanziSize=(hanziSize+1)%3;
  var labels=['A','A','A+'];this.textContent=labels[hanziSize];
  document.querySelectorAll('.v-hanzi').forEach(function(el){
    el.className='v-hanzi'+(sizeClasses[hanziSize]?' '+sizeClasses[hanziSize]:'');
  });
});

function applyFilter(){
  var q=document.getElementById('search').value.toLowerCase().trim();
  filtered=data[current].words.filter(function(w){
    if(activeCat!=='all'&&w.c!==activeCat)return false;
    if(!q)return true;
    return w.h.indexOf(q)>=0||w.p.toLowerCase().indexOf(q)>=0||w.fr.toLowerCase().indexOf(q)>=0||w.c.toLowerCase().indexOf(q)>=0;
  });
  renderVocab(filtered);
}
function renderVocab(words){
  document.getElementById('count-label').textContent=words.length+' résultat'+(words.length!==1?'s':'');
  var sc=sizeClasses[hanziSize];
  var grid=document.getElementById('vocab-grid');
  if(!words.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🔍</div><div style="font-size:13px;color:var(--c-hint)">Aucun résultat</div></div>';return;}
  var html='';
  words.forEach(function(w){
    html+='<div class="vocab-card" data-hanzi="'+encodeURIComponent(w.h)+'">'
      +'<div class="vc-top"><span class="v-hanzi'+(sc?' '+sc:'')+'">'+w.h+'</span><span class="v-sound">🔊</span></div>'
      +'<div class="v-pinyin'+(pinyinHidden?' hidden':'')+'">'+w.p+'</div>'
      +'<div class="v-fr">'+w.fr+'</div>'
      +'<div class="v-cat">'+w.c+'</div>'
    +'</div>';
  });
  grid.innerHTML=html;
  grid.querySelectorAll('.vocab-card').forEach(function(card){
    card.addEventListener('click',function(){
      var hanzi=decodeURIComponent(card.getAttribute('data-hanzi'));
      var w=filtered.find(function(x){return x.h===hanzi;})||{h:hanzi,p:'',fr:'',c:''};
      openWordSheet(w,card);
    });
  });
}
document.getElementById('search').addEventListener('input',function(){
  document.getElementById('search-clear').classList.toggle('visible',this.value.length>0);
  applyFilter();
});
document.getElementById('search-clear').addEventListener('click',function(){
  document.getElementById('search').value='';this.classList.remove('visible');applyFilter();
});

function startFlash(level,pool){
  flashLevel=level;flashIdx=0;flashFlipped=false;flashResults=[];
  flashQs=shuffle(pool||data[level].words).slice(0,Math.min(20,data[level].words.length));
  var d=data[level];
  document.getElementById('flash-topbar').className='topbar '+d.lc;
  document.getElementById('flash-title').textContent=d.label+' — Flash';
  document.getElementById('flash-badge').textContent=flashQs.length+' cartes';
  document.getElementById('flash-badge').className='topbar-badge';
  show('flash-view');
  renderFlash();
}
function renderFlash(){
  var w=flashQs[flashIdx];
  flashFlipped=false;
  var dots=flashQs.map(function(_,i){
    var cls=i<flashIdx?(flashResults[i]?'ok':'ko'):i===flashIdx?'cur':'';
    return '<div class="fp-dot'+(cls?' '+cls:'')+'"></div>';
  }).join('');
  var body=document.getElementById('flash-body');
  body.innerHTML=
    '<div class="flash-meta"><span>Carte '+(flashIdx+1)+' / '+flashQs.length+'</span>'
      +'<span>✓ '+flashResults.filter(Boolean).length+' / '+flashIdx+'</span></div>'
    +'<div class="flash-progress">'+dots+'</div>'
    +'<div class="flash-scene" id="flash-scene">'
      +'<div class="flash-card-3d" id="flash-card3d">'
        +'<div class="flash-face front">'
          +'<div class="flash-face-label">Hanzi</div>'
          +'<div class="flash-hanzi" id="flash-h">'+w.h+'</div>'
          +'<div class="flash-tap-hint">Appuyer pour révéler</div>'
        +'</div>'
        +'<div class="flash-face back">'
          +'<div class="flash-face-label">Traduction</div>'
          +'<div class="flash-fr">'+w.fr+'</div>'
          +'<div class="flash-pinyin">'+w.p+'</div>'
          +'<div class="flash-cat">'+w.c+'</div>'
        +'</div>'
      +'</div>'
    +'</div>'
    +'<div class="flash-actions" id="flash-btns" style="display:none">'
      +'<button class="flash-btn fail" id="fl-fail">✗ À revoir</button>'
      +'<button class="flash-btn pass" id="fl-pass">✓ Je sais</button>'
    +'</div>'
    +'<div style="text-align:center;margin-top:.5rem">'
      +'<button class="q-sound-btn" id="fl-snd">🔊 Écouter</button>'
    +'</div>';

  document.getElementById('flash-scene').addEventListener('click',function(){
    if(flashFlipped)return;
    flashFlipped=true;
    document.getElementById('flash-card3d').classList.add('flipped');
    document.getElementById('flash-btns').style.display='grid';
    speak(w.h,null,null);
  });
  document.getElementById('fl-snd').addEventListener('click',function(){speak(w.h,null,this);});
  document.getElementById('fl-fail').addEventListener('click',function(){flashNext(false);});
  document.getElementById('fl-pass').addEventListener('click',function(){flashNext(true);});
}
function flashNext(pass){
  flashResults.push(pass);
  flashIdx++;
  if(flashIdx>=flashQs.length){showFlashResults();return;}
  renderFlash();
}
function showFlashResults(){
  var ok=flashResults.filter(Boolean).length;
  var total=flashQs.length;
  var pct=Math.round(ok/total*100);
  _saveProg(flashLevel,'flash',pct);
  var wrongs=flashQs.filter(function(_,i){return !flashResults[i];});
  var body=document.getElementById('flash-body');
  body.innerHTML=
    '<div class="rcard">'
      +'<div class="remoji">'+(pct===100?'🏆':pct>=70?'🌟':'💪')+'</div>'
      +'<div class="rscore">'+ok+'<span>/'+total+'</span></div>'
      +'<div class="rtotal">'+pct+'% mémorisées</div>'
      +'<div class="rmsg">'+(pct===100?'Parfait !':pct>=70?'Bien joué !':'Continue !')+'</div>'
      +'<div class="ractns">'
        +(wrongs.length?'<button id="fl-rewrong" class="cta">🔁 Revoir les ratées ('+wrongs.length+')</button>':'')
        +'<button id="fl-again">🔀 Rejouer</button>'
        +'<button id="fl-menu">🎯 Activités</button>'
        +'<button id="fl-home">🏠</button>'
      +'</div>'
    +'</div>';
  if(wrongs.length)document.getElementById('fl-rewrong').addEventListener('click',function(){startFlash(flashLevel,wrongs);});
  document.getElementById('fl-again').addEventListener('click',function(){startFlash(flashLevel);});
  document.getElementById('fl-menu').addEventListener('click',function(){showQuizMenu(flashLevel);});
  document.getElementById('fl-home').addEventListener('click',goHome);
}

function shuffle(a){return a.slice().sort(function(){return Math.random()-.5;});}

function startQuiz(level,mode,pool){
  quizLevel=level;quizMode=mode||'normal';quizIdx=0;quizScore=0;
  quizAnswered=false;quizResults=[];quizStreak=0;
  var isSpecial=(level==='_express'||level==='_favs');
  if(isSpecial){
    quizQs=shuffle(pool||[]).slice(0,20);
    var specialLabel=level==='_express'?'⚡ Révision Express':'⭐ Mots Difficiles';
    document.getElementById('quiz-topbar').className='topbar l1';
    document.getElementById('quiz-title').textContent=specialLabel;
    document.getElementById('quiz-badge').textContent=quizQs.length+' q.';
    document.getElementById('quiz-badge').className='topbar-badge';
    show('quiz-view');
    document.getElementById('quiz-view').className='view active l1';
  } else {
    quizQs=shuffle(pool||data[level].words).slice(0,Math.min(15,data[level].words.length));
    var d=data[level];
    document.getElementById('quiz-topbar').className='topbar '+d.lc;
    var modeLabel=quizMode==='reverse'?' — FR→ZH':' — Quiz';
    document.getElementById('quiz-title').textContent=d.label+modeLabel;
    document.getElementById('quiz-badge').textContent=quizQs.length+' q.';
    document.getElementById('quiz-badge').className='topbar-badge';
    show('quiz-view');
    document.getElementById('quiz-view').className='view active '+d.lc;
  }
  renderQ();
}

function getDistr(correct,level){
  var pool;
  if(level==='_express'||level==='_favs'){
    pool=[];
    Object.keys(data).forEach(function(k){pool=pool.concat(data[k].words);});
  } else {
    pool=data[level].words;
  }
  return shuffle(pool.filter(function(w){return w.h!==correct.h;})).slice(0,3);
}

function renderQ(){
  quizAnswered=false;
  var q=quizQs[quizIdx];
  var distr=getDistr(q,quizLevel);
  var opts=shuffle([q].concat(distr));
  var pct=Math.round(quizIdx/quizQs.length*100);
  var isLast=quizIdx+1>=quizQs.length;
  var streakHtml=quizStreak>=2?'🔥 '+quizStreak+' d\'affilée':'&nbsp;';

  var body=document.getElementById('quiz-body');
  if(quizMode==='reverse'){
    // Show French word, choose hanzi
    body.innerHTML=
      '<div class="qpbar"><div class="qpfill" style="width:'+pct+'%"></div></div>'
      +'<div class="qmeta">'
        +'<span>Question '+(quizIdx+1)+' / '+quizQs.length+'</span>'
        +'<span class="streak'+(quizStreak<2?' hidden':'')+'">'+streakHtml+'</span>'
        +'<span id="qlive">Score : '+quizScore+' / '+quizIdx+'</span>'
      +'</div>'
      +'<div class="qcard">'
        +'<div class="q-fr-prompt">'+q.fr+'</div>'
        +'<div class="q-pinyin" style="font-style:italic;font-size:13px;color:var(--c-hint)">'+q.c+'</div>'
        +'<div class="q-lbl">Quel est le hanzi ?</div>'
      +'</div>'
      +'<div class="qopts" id="qopts">'
        +opts.map(function(o,i){return '<button class="qopt" id="o'+i+'" style="font-size:22px;">'+o.h+'<div style="font-size:11px;color:var(--c-hint)">'+o.p+'</div></button>';}).join('')
      +'</div>'
      +'<div class="qfb" id="qfb"></div>'
      +'<button class="qnext" id="qnext" style="display:none">'+(isLast?'Voir les résultats →':'Suivant →')+'</button>';
  } else {
    body.innerHTML=
      '<div class="qpbar"><div class="qpfill" style="width:'+pct+'%"></div></div>'
      +'<div class="qmeta">'
        +'<span>Question '+(quizIdx+1)+' / '+quizQs.length+'</span>'
        +'<span class="streak'+(quizStreak<2?' hidden':'')+'">'+streakHtml+'</span>'
        +'<span id="qlive">Score : '+quizScore+' / '+quizIdx+'</span>'
      +'</div>'
      +'<div class="qcard">'
        +'<div class="q-hanzi">'+q.h+'</div>'
        +'<button class="q-sound-btn" id="q-snd">🔊 Écouter</button>'
        +'<div class="q-pinyin">'+q.p+'</div>'
        +'<div class="q-lbl">Quelle est la traduction ?</div>'
      +'</div>'
      +'<div class="qopts" id="qopts">'
        +opts.map(function(o,i){return '<button class="qopt" id="o'+i+'">'+o.fr+'</button>';}).join('')
      +'</div>'
      +'<div class="qfb" id="qfb"></div>'
      +'<button class="qnext" id="qnext" style="display:none">'+(isLast?'Voir les résultats →':'Suivant →')+'</button>';
    var sndBtn=document.getElementById('q-snd');
    sndBtn.addEventListener('click',function(){speak(q.h,null,this);});
  }

  opts.forEach(function(o,i){
    document.getElementById('o'+i).addEventListener('click',function(){answerQ(i,o,q);});
  });
  document.getElementById('qnext').addEventListener('click',nextQ);
}

function answerQ(idx,chosen,correct){
  if(quizAnswered)return;
  quizAnswered=true;
  var isOk=chosen.h===correct.h;
  if(isOk){quizScore++;quizStreak++;}else{quizStreak=0;}
  quizResults.push({word:correct,correct:isOk});
  _srsUpdate(correct.h,isOk);

  document.querySelectorAll('.qopt').forEach(function(b,i){
    b.classList.add('disabled');
    if(i===idx)b.classList.add(isOk?'correct':'wrong');
    if(!isOk&&(quizMode==='reverse'?b.style.fontSize&&b.textContent.indexOf(correct.h)>=0:b.textContent.trim()===correct.fr))b.classList.add('correct');
  });
  // For reverse mode mark correct hanzi
  if(!isOk&&quizMode==='reverse'){
    document.querySelectorAll('.qopt').forEach(function(b){
      if(b.textContent.indexOf(correct.h)>=0)b.classList.add('correct');
    });
  }
  var fb=document.getElementById('qfb');
  var fbExtra=quizStreak>=3?' 🔥 '+quizStreak+' d\'affilée !':'';
  fb.textContent=isOk?'✓ Correct !'+fbExtra:'✗ '+(quizMode==='reverse'?correct.h+' ('+correct.fr+')':correct.fr);
  fb.style.color=isOk?'var(--c1)':'var(--c5)';
  document.getElementById('qlive').textContent='Score : '+quizScore+' / '+(quizIdx+1);
  document.getElementById('qnext').style.display='block';
}
function nextQ(){quizIdx++;if(quizIdx>=quizQs.length){showResults();return;}renderQ();}

        +(wrong.length?'<button id="r-wrongs" class="cta">🔁 Erreurs ('+wrong.length+')</button>':'')
        +'<button id="r-retry">🔀 Rejouer</button>'
        +(!isSpecialSession?'<button id="r-flip">🃏 Flash</button>':'')
        +(!isSpecialSession?'<button id="r-vocab">📖 Vocabulaire</button>':'')
        +'<button id="r-home">🏠</button>'
      +'</div>'
    +'</div>'
    +(wrong.length
      ?'<div class="wrong-section">'
        +'<div class="wrong-title">À retravailler ('+wrong.length+') :</div>'
        +wrong.map(function(r){
          return '<div class="rb-row">'
            +'<div class="rb-h" data-hanzi="'+encodeURIComponent(r.word.h)+'">'+r.word.h+'</div>'
            +'<div class="rb-pin">'+r.word.p+'</div>'

            +'<div class="rb-x">✗</div>'

      +'</div>'
      :'<div style="font-size:13px;color:var(--c1);margin-top:8px">✓ Aucune erreur — bravo !</div>');

  // Animate stars
  setTimeout(function(){
    for(var i=1;i<=3;i++){
      (function(n){
        setTimeout(function(){if(n<=stars)document.getElementById('s'+n).classList.add('lit');},n*220);
      })(i);
    }
  },150);

  if(wrong.length){
    document.getElementById('r-wrongs').addEventListener('click',function(){
      startQuiz(quizLevel,quizMode,wrong.map(function(r){return r.word;}));
    });

  document.getElementById('r-retry').addEventListener('click',function(){
    if(quizLevel==='_express')startExpress();

function startDict(level){
  dictLevel=level;dictIdx=0;dictScore=0;dictAnswered=false;dictResults=[];dictStreak=0;
  var d=data[level];
  dictQs=shuffle(d.words).slice(0,Math.min(15,d.words.length));
  document.getElementById('quiz-topbar').className='topbar '+d.lc;
  document.getElementById('quiz-title').textContent=d.label+' — Dictée';
  document.getElementById('quiz-badge').textContent=dictQs.length+' q.';
  document.getElementById('quiz-badge').className='topbar-badge';
  show('quiz-view');
  document.getElementById('quiz-view').className='view active '+d.lc;
  renderDict();
}

function _getDictDistr(correct,level){
  var pool=shuffle(data[level].words.filter(function(w){return w.h!==correct.h;}));
  var sameCat=pool.filter(function(w){return w.c===correct.c;});
  return sameCat.concat(pool.filter(function(w){return w.c!==correct.c;})).slice(0,3);
}

function renderDict(){
  dictAnswered=false;
  var q=dictQs[dictIdx];
  var opts=shuffle([q].concat(_getDictDistr(q,dictLevel)));
  var pct=Math.round(dictIdx/dictQs.length*100);
  var isLast=dictIdx+1>=dictQs.length;
  var streakHtml=dictStreak>=2?'🔥 '+dictStreak+' d\'affilée':'&nbsp;';

  var body=document.getElementById('quiz-body');
  body.innerHTML=
    '<div class="qpbar"><div class="qpfill" style="width:'+pct+'%"></div></div>'
    +'<div class="qmeta">'
      +'<span>Question '+(dictIdx+1)+' / '+dictQs.length+'</span>'
      +'<span class="streak'+(dictStreak<2?' hidden':'')+'">'+streakHtml+'</span>'
      +'<span id="dlive">Score : '+dictScore+' / '+dictIdx+'</span>'
    +'</div>'
    +'<div class="qcard">'
      +'<button class="dict-listen-btn" id="dict-snd"><span class="dict-snd-icon">🔊</span><span class="dict-snd-lbl">Écouter</span></button>'
      +'<div class="q-lbl">Quel est ce mot ?</div>'
      +'<div id="dict-reveal" style="min-height:44px;margin-top:.4rem"></div>'
    +'</div>'
    +'<div class="qopts" id="dopts">'
      +opts.map(function(o,i){return '<button class="qopt" id="do'+i+'" style="font-size:22px">'+o.h+'</button>';}).join('')
    +'</div>'
    +'<div class="qfb" id="dfb"></div>'
    +'<button class="qnext" id="dnext" style="display:none">'+(isLast?'Voir les résultats →':'Suivant →')+'</button>';

  var sndBtn=document.getElementById('dict-snd');
  sndBtn.addEventListener('click',function(){speak(q.h,null,this);});
  // iOS : pas d'auto-lecture, l'utilisateur tape le bouton manuellement

  opts.forEach(function(o,i){
    document.getElementById('do'+i).addEventListener('click',function(){_answerDict(i,o,q,opts);});
  });

}

function _answerDict(idx,chosen,correct,opts){

  var isOk=chosen.h===correct.h;

// ASSOCIATION — Relier les paires
// ════════════════════════════════════════════════
var ASSOC_N=5;

function startAssoc(level){
  assocLevel=level;assocAttempts=0;
  assocMatched=new Set();
  _assocPendingType=null;_assocPendingIdx=null;
  var d=data[level];
  assocPairs=shuffle(d.words).slice(0,Math.min(ASSOC_N,d.words.length));
  assocLeft=shuffle(assocPairs.slice());
  assocRight=shuffle(assocPairs.slice());
  document.getElementById('quiz-topbar').className='topbar '+d.lc;
  document.getElementById('quiz-title').textContent=d.label+' — Association';
  document.getElementById('quiz-badge').textContent='0 / '+assocPairs.length+' paires';
  document.getElementById('quiz-badge').className='topbar-badge';
  show('quiz-view');
  document.getElementById('quiz-view').className='view active '+d.lc;
  renderAssoc();
}

function renderAssoc(){
  var body=document.getElementById('quiz-body');
  body.innerHTML=
    '<div style="font-size:13px;color:var(--c-muted);text-align:center;margin:.3rem 0 .8rem">Relie chaque hanzi à sa traduction française</div>'
    +'<div class="assoc-area">'
      +'<div class="assoc-col">'
        +assocLeft.map(function(w,i){
          return '<button class="assoc-card h-card" id="ac-h-'+i+'">'+w.h+'</button>';
        }).join('')
      +'</div>'
      +'<div class="assoc-col">'
        +assocRight.map(function(w,i){
          return '<button class="assoc-card fr-card" id="ac-fr-'+i+'">'+w.fr+'</button>';
        }).join('')
      +'</div>'
    +'</div>'
    +'<div class="qfb" id="assoc-fb" style="text-align:center;min-height:20px"></div>';

  assocLeft.forEach(function(w,i){
    document.getElementById('ac-h-'+i).addEventListener('click',function(){_assocTap('h',i);});
  });
  assocRight.forEach(function(w,i){
    document.getElementById('ac-fr-'+i).addEventListener('click',function(){_assocTap('fr',i);});
  });
  // Restaure les paires déjà trouvées (si re-render)
  assocMatched.forEach(function(h){
    var li=assocLeft.findIndex(function(w){return w.h===h;});
    var ri=assocRight.findIndex(function(w){return w.h===h;});
    if(li>=0)_assocSetCard('h',li,'matched');
    if(ri>=0)_assocSetCard('fr',ri,'matched');
  });
}

function _assocSetCard(type,idx,state){
  var el=document.getElementById('ac-'+type+'-'+idx);
  if(!el)return;
  el.className='assoc-card '+(type==='h'?'h-card':'fr-card')+(state?' '+state:'');
}

function _assocTap(type,idx){
  var word=type==='h'?assocLeft[idx]:assocRight[idx];
  if(assocMatched.has(word.h))return;

  if(_assocPendingType===null){
    _assocPendingType=type;_assocPendingIdx=idx;
    _assocSetCard(type,idx,'selected');
    return;
  }
  if(_assocPendingType===type){
    // Même colonne → change de sélection
    _assocSetCard(_assocPendingType,_assocPendingIdx,'');
    _assocPendingType=type;_assocPendingIdx=idx;
    _assocSetCard(type,idx,'selected');
    return;
  }
  // Colonnes différentes → vérifier la paire
  var pendingWord=_assocPendingType==='h'?assocLeft[_assocPendingIdx]:assocRight[_assocPendingIdx];
  var pType=_assocPendingType,pIdx=_assocPendingIdx;
  _assocPendingType=null;_assocPendingIdx=null;
  assocAttempts++;

  var fb=document.getElementById('assoc-fb');
  if(pendingWord.h===word.h){
    // ✓ Bonne paire
    assocMatched.add(word.h);
    _assocSetCard(pType,pIdx,'matched');
    _assocSetCard(type,idx,'matched');
    fb.textContent='✓ '+word.h+' = '+word.fr+'  ('+word.p+')';
    fb.style.color='var(--c1)';
    document.getElementById('quiz-badge').textContent=assocMatched.size+' / '+assocPairs.length+' paires';
    if(assocMatched.size===assocPairs.length)setTimeout(showAssocResults,800);
  }else{
    // ✗ Mauvaise paire
    _assocSetCard(pType,pIdx,'wrong');
    _assocSetCard(type,idx,'wrong');
    fb.textContent='✗ Pas la bonne paire, essaie encore !';
    fb.style.color='var(--c5)';
    setTimeout(function(){
      if(!assocMatched.has(pendingWord.h))_assocSetCard(pType,pIdx,'');
      if(!assocMatched.has(word.h))_assocSetCard(type,idx,'');
      var fb2=document.getElementById('assoc-fb');
      if(fb2&&fb2.style.color==='var(--c5)')fb2.textContent='';
    },750);
  }
}

function showAssocResults(){
  var n=assocPairs.length;
  var stars=assocAttempts===n?3:assocAttempts<=n+2?2:assocAttempts<=n*2?1:0;
  var pct=Math.round(n/assocAttempts*100);
  _saveProg(assocLevel,'assoc',pct);
  var emoji=stars===3?'🏆':stars===2?'🌟':stars===1?'👍':'📚';
  var msg=stars===3?'Parfait du premier coup !':stars===2?'Très bien joué !':stars===1?'Bien joué !':'Continue à t\'entraîner !';
  var body=document.getElementById('quiz-body');

  body.innerHTML=
    '<div class="rcard">'
      +'<div class="remoji">'+emoji+'</div>'
      +'<div class="rscore">'+assocAttempts+'<span> essais</span></div>'
      +'<div class="rtotal">'+n+' paires — '+pct+'% d\'efficacité</div>'
      +'<div class="stars-row"><span class="star" id="as1">⭐</span><span class="star" id="as2">⭐</span><span class="star" id="as3">⭐</span></div>'
      +'<div class="rmsg">'+msg+'</div>'
      +'<div class="ractns">'
        +'<button id="ar-retry" class="cta">🔁 Rejouer</button>'
        +'<button id="ar-quiz">🎯 Quiz</button>'
        +'<button id="ar-vocab">📖 Vocabulaire</button>'
        +'<button id="ar-home">🏠</button>'
      +'</div>'

  setTimeout(function(){

      setTimeout(function(){if(n2<=stars)document.getElementById('as'+n2).classList.add('lit');},n2*220);
    })(i);}

  document.getElementById('ar-retry').addEventListener('click',function(){startAssoc(assocLevel);});

}

// ════════════════════════════════════════════════
// SENTENCE COMPLETION GAME
// ════════════════════════════════════════════════
function getSentDistr(answerWord,level){
  var pool=shuffle(data[level].words.filter(function(w){return w.h!==answerWord.h;}));
  var sameCat=pool.filter(function(w){return w.c===answerWord.c;});
  var diff=pool.filter(function(w){return w.c!==answerWord.c;});
  return sameCat.concat(diff).slice(0,3);
}

function startSentGame(level){
  sentLevel=level;sentIdx=0;sentScore=0;sentAnswered=false;sentResults=[];sentStreak=0;
  var d=data[level];
  var raw=sentences[level]||[];
  sentQs=shuffle(raw).slice(0,Math.min(10,raw.length)).map(function(s){
    var w=data[level].words.find(function(x){return x.h===s[1];});
    return w?{s:s[0],word:w,fr:s[2]}:null;
  }).filter(Boolean);
  document.getElementById('sent-topbar').className='topbar '+d.lc;
  document.getElementById('sent-title').textContent=d.label+' — Phrases';
  document.getElementById('sent-badge').textContent=sentQs.length+' ph.';
  document.getElementById('sent-badge').className='topbar-badge';
  show('sent-view');
  document.getElementById('sent-view').className='view active '+d.lc;
  renderSent();
}

function _renderSentence(s,word,filled){
  var parts=s.split('___');
  var blankHtml=filled
    ?'<span class="sent-blank filled">'+word.h+'</span>'
    :'<span class="sent-blank">___</span>';
  return parts[0]+blankHtml+(parts[1]||'');
}

function renderSent(){
  sentAnswered=false;
  var q=sentQs[sentIdx];
  var distr=getSentDistr(q.word,sentLevel);
  var opts=shuffle([q.word].concat(distr));
  var pct=Math.round(sentIdx/sentQs.length*100);
  var isLast=sentIdx+1>=sentQs.length;
  var streakHtml=sentStreak>=2?'🔥 '+sentStreak+' d\'affilée':'&nbsp;';

  var body=document.getElementById('sent-body');
  body.innerHTML=
    '<div class="qpbar"><div class="qpfill" style="width:'+pct+'%"></div></div>'
    +'<div class="qmeta">'
      +'<span>Phrase '+(sentIdx+1)+' / '+sentQs.length+'</span>'
      +'<span class="streak'+(sentStreak<2?' hidden':'')+'">'+streakHtml+'</span>'
      +'<span id="slive">Score : '+sentScore+' / '+sentIdx+'</span>'
    +'</div>'
    +'<div class="qcard">'
      +'<div class="sent-sentence" id="sent-sent">'+_renderSentence(q.s,q.word,false)+'</div>'
      +'<div class="sent-fr">'+q.fr+'</div>'
    +'</div>'
    +'<div class="qopts" id="sopts">'
      +opts.map(function(o,i){
        return '<button class="qopt" id="so'+i+'" style="font-size:20px;line-height:1.3">'
          +o.h+'<div style="font-size:11px;color:var(--c-hint)">'+o.p+'</div></button>';
      }).join('')
    +'</div>'
    +'<div class="qfb" id="sfb"></div>'
    +'<button class="qnext" id="snext" style="display:none">'+(isLast?'Voir les résultats →':'Suivant →')+'</button>';

  opts.forEach(function(o,i){
    document.getElementById('so'+i).addEventListener('click',function(){answerSent(i,o,q);});
  });
  document.getElementById('snext').addEventListener('click',nextSent);
}

function answerSent(idx,chosen,q){
  if(sentAnswered)return;
  sentAnswered=true;
  var isOk=chosen.h===q.word.h;
  if(isOk){sentScore++;sentStreak++;}else{sentStreak=0;}
  sentResults.push({q:q,chosen:chosen,correct:isOk});

  document.getElementById('sent-sent').innerHTML=_renderSentence(q.s,q.word,true);

  document.querySelectorAll('.qopt').forEach(function(b,i){
    b.classList.add('disabled');
    if(i===idx)b.classList.add(isOk?'correct':'wrong');
  });
  if(!isOk){
    document.querySelectorAll('.qopt').forEach(function(b){
      if(b.textContent.indexOf(q.word.h)>=0)b.classList.add('correct');
    });
  }
  var fb=document.getElementById('sfb');
  var fbExtra=sentStreak>=3?' 🔥 '+sentStreak+' d\'affilée !':'';
  fb.textContent=isOk?'✓ Correct !'+fbExtra:'✗ '+q.word.h+' ('+q.word.fr+')';
  fb.style.color=isOk?'var(--c1)':'var(--c5)';
  document.getElementById('slive').textContent='Score : '+sentScore+' / '+(sentIdx+1);
  document.getElementById('snext').style.display='block';
}

function nextSent(){sentIdx++;if(sentIdx>=sentQs.length){showSentResults();return;}renderSent();}

function showSentResults(){
  var total=sentQs.length,pct=Math.round(sentScore/total*100);
  _saveProg(sentLevel,'sent',pct);
  var stars=pct===100?3:pct>=80?3:pct>=60?2:pct>=40?1:0;
  var emoji=pct===100?'🏆':pct>=80?'🌟':pct>=60?'👍':pct>=40?'💪':'📚';
  var msg=pct===100?'Parfait ! Maîtrise totale !':pct>=80?'Excellent !':pct>=60?'Bien joué !':pct>=40?'Continue !':'Révise encore !';
  var wrong=sentResults.filter(function(r){return !r.correct;});
  var body=document.getElementById('sent-body');

  body.innerHTML=
    '<div class="qpbar"><div class="qpfill" style="width:100%"></div></div>'
    +'<div class="rcard">'
      +'<div class="remoji">'+emoji+'</div>'
      +'<div class="rscore">'+sentScore+'<span>/'+total+'</span></div>'
      +'<div class="rtotal">'+pct+'% de bonnes réponses</div>'
      +'<div class="stars-row">'
        +'<span class="star" id="ss1">⭐</span><span class="star" id="ss2">⭐</span><span class="star" id="ss3">⭐</span>'
      +'</div>'
      +'<div class="rmsg">'+msg+'</div>'
      +'<div class="ractns">'
        +'<button id="sr-retry" class="cta">🔁 Rejouer</button>'
        +'<button id="sr-quiz">🎯 Quiz</button>'
        +'<button id="sr-vocab">📖 Vocabulaire</button>'
        +'<button id="sr-home">🏠</button>'
      +'</div>'
    +'</div>'
    +(wrong.length
      ?'<div class="wrong-section">'
        +'<div class="wrong-title">À retravailler ('+wrong.length+') :</div>'
        +wrong.map(function(r){
          return '<div class="rb-row">'
            +'<div class="rb-h" data-hanzi="'+encodeURIComponent(r.q.word.h)+'">'+r.q.word.h+'</div>'
            +'<div class="rb-pin">'+r.q.word.p+'</div>'
            +'<div class="rb-fr">'+r.q.word.fr+'</div>'
            +'<div class="rb-x">✗</div>'
          +'</div>';
        }).join('')
      +'</div>'
      :'<div style="font-size:13px;color:var(--c1);margin-top:8px">✓ Aucune erreur — bravo !</div>');

  setTimeout(function(){
    for(var i=1;i<=3;i++){
      (function(n){
        setTimeout(function(){if(n<=stars)document.getElementById('ss'+n).classList.add('lit');},n*220);
      })(i);
    }
  },150);

  document.getElementById('sr-retry').addEventListener('click',function(){startSentGame(sentLevel);});
  document.getElementById('sr-quiz').addEventListener('click',function(){showQuizMenu(sentLevel);});
  document.getElementById('sr-vocab').addEventListener('click',function(){showLevel(sentLevel);});
  document.getElementById('sr-home').addEventListener('click',goHome);
  document.querySelectorAll('.rb-h').forEach(function(el){
    el.addEventListener('click',function(){speak(decodeURIComponent(el.getAttribute('data-hanzi')),null,null);});
  });
}
